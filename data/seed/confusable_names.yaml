# Realistic typosquat / name-confusion candidates.
# The builder verifies existence. If the name resolves, the task is
# labeled confusable_resolvable (expected: REVIEW or BLOCK).
# If it does not resolve, the task is labeled confusable_nonexistent
# (expected: BLOCK).

